<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <link rel="apple-touch-icon" href="img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitrianto Althaf | Graphic Designer Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer components {
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-600;
            }
            .bg-gradient-custom {
                @apply bg-gradient-to-r from-indigo-600 to-purple-700;
            }
            .nav-link {
                @apply font-semibold text-sm text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-white transition-all duration-300 px-4 py-2 rounded-xl;
            }
            .nav-link.active {
                @apply bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 ring-1 ring-indigo-500/20;
            }
            .card-portfolio {
                @apply bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 overflow-hidden transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl dark:hover:shadow-indigo-500/10;
            }
            .input-field {
                @apply w-full px-5 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all dark:text-white;
            }
            
            /* Class Animasi Interaktif */
            .scroll-animate {
                @apply opacity-0 translate-y-8 transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)];
            }
            .scroll-animate.show {
                @apply opacity-100 translate-y-0;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <nav id="navbar" class="fixed w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="https://fitriantoalthaf.github.io/portofolio/" class="text-2xl font-bold tracking-tighter text-gradient hover:opacity-80 transition-opacity">
                FITRIANTO ALTHAF
            </a>
            
            <div class="flex items-center gap-2 md:gap-6">
                <div class="hidden md:flex items-center space-x-1">
                    <a href="#home" class="nav-link active">Home</a>
                    <a href="#about" class="nav-link">Tentang</a>
                    <a href="#portfolio" class="nav-link">Portfolio</a>
                    <a href="#contact" id="nav-contact-btn" class="bg-gradient-custom text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-indigo-200 hover:opacity-90 transition ml-4">Kontak</a>
                </div>

                <button id="dark-mode-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 transition-all">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                
                <button id="menu-btn" class="md:hidden text-2xl p-2 text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-6 py-8 space-y-4 shadow-2xl">
            <a href="#home" class="nav-link mobile-link block text-lg">Home</a>
            <a href="#about" class="nav-link mobile-link block text-lg">Tentang</a>
            <a href="#portfolio" class="nav-link mobile-link block text-lg">Portfolio</a>
            <a href="#contact" class="bg-gradient-custom text-white px-6 py-4 rounded-2xl text-center font-bold block shadow-lg mobile-link">Kontak</a>
        </div>
    </nav>

    <section id="home" class="relative pt-32 md:pt-48 pb-20 md:pb-32 px-6 bg-slate-900 overflow-hidden">
        <div class="absolute top-0 left-1/4 w-72 md:w-96 h-72 md:h-96 bg-indigo-600/20 blur-[100px] rounded-full animate-blob"></div>
        <div class="absolute bottom-0 right-1/4 w-72 md:w-96 h-72 md:h-96 bg-purple-600/20 blur-[100px] rounded-full animate-blob [animation-delay:2s]"></div>

        <div class="relative max-w-4xl mx-auto text-center">
            <span class="inline-block py-1 px-4 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-[10px] md:text-xs font-bold tracking-widest uppercase mb-6">Visual Designer & Artist</span>
            <h1 class="text-4xl md:text-7xl font-extrabold text-white mb-6 leading-[1.1]">Desain Visual & <br><span class="text-gradient">Identitas Kreatif.</span></h1>
            <p class="text-slate-400 text-base md:text-xl mb-10 max-w-2xl mx-auto">Membantu brand Anda tampil menonjol dengan desain eksklusif yang modern dan profesional.</p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4 px-4">
                <a href="#portfolio" class="bg-gradient-custom text-white px-10 py-4 rounded-2xl font-bold hover:scale-105 transition shadow-xl shadow-indigo-500/20 text-center">Lihat Karya</a>
                <a href="#contact" class="bg-white/5 backdrop-blur-sm text-white border border-white/10 px-10 py-4 rounded-2xl font-bold hover:bg-white/10 transition text-center">Hubungi Saya</a>
            </div>
        </div>
    </section>

    <section id="about" class="py-20 md:py-32 max-w-6xl mx-auto px-6 scroll-animate">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
            <div class="relative order-2 lg:order-1">
                <div class="aspect-[4/5] bg-slate-200 dark:bg-slate-800 rounded-[40px] overflow-hidden shadow-2xl">
                    <img src="img/fitrianto.png" class="w-full h-full object-cover" alt="Fitrianto Althaf Profile">
                </div>
                <div class="absolute -bottom-6 -right-6 bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 hidden sm:block">
                    <p class="text-indigo-600 dark:text-indigo-400 font-bold uppercase tracking-tighter text-xs mb-1">Status</p>
                    <p class="text-slate-800 dark:text-slate-100 font-
